<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RentMate | Manager</title><style>
:root{font-family:Inter,system-ui,Arial;color:#182946;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#15253f,#4569e8);color:white;padding:20px 5%;display:flex;align-items:center;justify-content:space-between;gap:16px}h1{margin:0;font-size:24px}small{color:#66758b}header small{color:#dce6ff}main{max-width:1200px;margin:auto;padding:24px}nav{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}button{background:#4569e8;border:0;border-radius:10px;padding:11px 16px;color:white;cursor:pointer;font-weight:600}button:disabled{opacity:.5}button.secondary{background:#e8eeff;color:#243c79}button.danger{background:#c44949}input,select,textarea{border:1px solid #cfd9e8;border-radius:10px;padding:12px;width:100%;font:inherit;background:white}label{display:block;font-size:13px;font-weight:600;margin:10px 0 5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.card{background:white;border-radius:18px;padding:20px;box-shadow:0 4px 24px #243c790d;margin-bottom:16px}.property{overflow:hidden;padding:0}.property img{width:100%;height:160px;object-fit:cover;background:#e4eafa}.property .body{padding:18px}h2{font-size:21px}h3{margin:4px 0 10px}p{color:#64748b}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #e5ebf5;text-align:left}section[hidden]{display:none!important}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}#notice{padding:12px;border-radius:10px;background:#e6f5ef;color:#17604a;display:none;margin-bottom:16px}.muted{color:#64748b;font-size:13px}.badge{display:inline-block;border-radius:8px;background:#e8eeff;padding:5px 8px;font-size:12px}#login{max-width:420px;margin:70px auto}#app{display:none}@media(max-width:600px){main{padding:12px}header{padding:16px}table{font-size:12px}}
</style></head><body><header><div><h1>⌂ RentMate <span style="font-weight:400">Manager</span></h1><small>Your properties, tenants and rent in one place</small></div><button id="logout" class="secondary" style="display:none">Sign out</button></header><main><div id="notice"></div><section id="login" class="card"><h2>Manager sign in</h2><p>Only approved property managers can access this portal.</p><form id="loginForm"><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><p><button style="width:100%">Sign in</button></p></form><p class="muted">Manager accounts must be activated by a system administrator.</p></section><div id="app"><nav><button onclick="show('properties')">Properties</button><button onclick="show('requests')">Joining requests</button><button onclick="show('tenants')">Tenants & rent</button><button onclick="show('ledger')">Rent ledger</button></nav><section id="properties"><div class="card"><h2>Add a property</h2><form id="propertyForm"><div class="grid"><div><label>Property name</label><input name="name" required placeholder="The Green House"></div><div><label>Address</label><input name="address" required></div><div><label>Number of rooms</label><input name="rooms_count" type="number" min="1" value="5" required></div><div><label>Monthly rent (R)</label><input name="monthly_rent" type="number" step="0.01" min="1" required></div><div><label>Rent due day (1–28)</label><input name="due_day" type="number" min="1" max="28" value="1" required></div></div><p><button>Create property</button></p></form></div><div id="propertyCards" class="grid"></div></section><section id="requests" hidden><h2>Joining requests</h2><div id="requestList"></div></section><section id="tenants" hidden><h2>Tenants & monthly rent</h2><div id="tenantList"></div></section><section id="ledger" hidden><h2>Rent ledger</h2><div id="ledgerList"></div></section></div></main><script>
const API='/api';let token=sessionStorage.getItem('manager_token')||'',houses=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const zar=n=>'R'+(Number(n||0)/100).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});const cents=n=>Math.round(Number(n)*100);
function msg(t,bad=false){const n=$('notice');n.textContent=t;n.style.display='block';n.style.background=bad?'#ffe8e8':'#e6f5ef';n.style.color=bad?'#a52e2e':'#17604a';setTimeout(()=>n.style.display='none',6500)}
async function api(path,method='GET',data){const r=await fetch(API+path,{method,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed: '+r.status);return j}
async function act(fn){try{await fn()}catch(e){msg(e.message,true)}}
function show(which){['properties','requests','tenants','ledger'].forEach(x=>$(x).hidden=x!==which);if(which==='requests')act(loadRequests);if(which==='tenants')act(loadTenants);if(which==='ledger')act(loadLedger)}
async function load(){houses=await api('/manager/overview');$('propertyCards').innerHTML=houses.map(h=>`<article class="card property"><img src="${API}/public/households/${h.id}/photo" onerror="this.style.display='none'" alt="Property photo"><div class="body"><h3>${esc(h.name)}</h3><p>${esc(h.address)}</p><div class="row"><span class="badge">${h.occupied}/${h.rooms_count} rooms occupied</span><span class="badge">${h.pending} pending</span></div><p><b>${zar(h.monthly_rent_cents)}</b> monthly • due day ${h.due_day}</p><label>Upload property picture (JPEG, PNG, WebP; max 2 MB)</label><input type="file" accept="image/jpeg,image/png,image/webp" onchange="uploadPhoto('${h.id}',this)"><p><button class="secondary" onclick="editProperty('${h.id}')">Edit property</button> <button onclick="bill('${h.id}')">Issue this month's rent</button></p></div></article>`).join('')||'<p>No properties yet. Create your first property above.</p>'}
window.uploadPhoto=async(id,input)=>act(async()=>{const file=input.files[0];if(!file)return;if(file.size>2*1024*1024)throw Error('Maximum 2 MB');const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(file)});await api('/manager/properties/'+id+'/photo','POST',{mime:file.type,data});msg('Photo saved');await load()});
window.editProperty=id=>act(async()=>{const h=houses.find(x=>x.id===id);const name=prompt('Property name',h.name);if(name===null)return;const address=prompt('Address',h.address);if(address===null)return;const rooms_count=Number(prompt('Number of rooms',h.rooms_count));const monthly_rent_cents=cents(prompt('Monthly rent in rand',h.monthly_rent_cents/100));const due_day=Number(prompt('Rent due day (1–28)',h.due_day));await api('/manager/properties/'+id,'PATCH',{name,address,rooms_count,monthly_rent_cents,due_day});msg('Property updated');await load()});
window.bill=id=>act(async()=>{const r=await api('/manager/properties/'+id+'/bill','POST',{});msg(r.charges_created+' new rent charges issued. Existing charges were not duplicated.')});
async function loadRequests(){let out='';for(const h of houses){const r=await api('/manager/properties/'+h.id+'/requests');out+=`<div class="card"><h3>${esc(h.name)}</h3>${r.length?r.map(x=>`<div style="padding:12px;border-bottom:1px solid #eee"><b>${esc(x.name)}</b> <span class="muted">${esc(x.email)}</span> <span class="badge">${esc(x.status)}</span>${x.status==='pending'?`<div class="row"><button onclick="decision('${x.id}',true,${h.rooms_count},${h.monthly_rent_cents})">Approve & assign room</button><button class="danger" onclick="decision('${x.id}',false)">Decline</button></div>`:''}</div>`).join(''):'<p>No joining requests.</p>'}</div>`}$('requestList').innerHTML=out}
window.decision=(id,approve,max,defaultRent)=>act(async()=>{let data={approve};if(approve){const room=prompt('Room number (1–'+max+'). Leave blank to assign later:','');if(room===null)return;const rent=prompt('Monthly rent for this tenant (R)',String(defaultRent/100));if(rent===null)return;data.monthly_rent_cents=cents(rent);if(room.trim())data.room_number=Number(room)}await api('/manager/requests/'+id+'/decision','POST',data);msg(approve?'Tenant approved':'Request declined');await load();await loadRequests()});
async function loadTenants(){let out='';for(const h of houses){const r=await api('/manager/properties/'+h.id+'/tenants');out+=`<div class="card"><h3>${esc(h.name)}</h3><table><tr><th>Tenant</th><th>Room</th><th>Monthly rent</th><th>Action</th></tr>${r.map(x=>`<tr><td>${esc(x.name)}<br><small>${esc(x.email)}</small></td><td>${x.room_number??'—'}</td><td>${zar(x.monthly_rent_cents)}</td><td><button class="secondary" onclick="editTenant('${h.id}','${x.id}',${x.monthly_rent_cents},${x.room_number??'null'})">Edit</button></td></tr>`).join('')}</table></div>`}$('tenantList').innerHTML=out}
window.editTenant=(h,t,rent,room)=>act(async()=>{const n=prompt('Monthly rent in rand',String(rent/100));if(n===null)return;const r=prompt('Room number (blank for unassigned)',room??'');if(r===null)return;await api('/manager/properties/'+h+'/tenants/'+t,'PATCH',{monthly_rent_cents:cents(n),room_number:r.trim()?Number(r):null});msg('Tenant updated; future monthly charges use the new rent.');await loadTenants()});
async function loadLedger(){let out='';for(const h of houses){const r=await api('/manager/households/'+h.id+'/ledger');out+=`<div class="card"><h3>${esc(h.name)}</h3><div style="overflow:auto"><table><tr><th>Tenant</th><th>Due</th><th>Charged</th><th>Paid</th><th>Outstanding</th><th>Action</th></tr>${r.map(x=>`<tr><td>${esc(x.tenant_name)}</td><td>${esc(x.due_date).slice(0,10)}</td><td>${zar(x.amount_cents)}</td><td>${zar(x.paid_cents)}</td><td>${zar(x.outstanding_cents)}</td><td>${x.outstanding_cents>0?`<button onclick="verify('${x.id}',${x.outstanding_cents})">Record verified payment</button>`:''}</td></tr>`).join('')}</table></div></div>`}$('ledgerList').innerHTML=out}
window.verify=(id,remaining)=>act(async()=>{const amt=prompt('Amount actually received and verified (R)',String(remaining/100));if(amt===null)return;const reference=prompt('Bank reference / receipt number','')||'';if(!confirm('Confirm that you have actually received this money?'))return;await api('/manager/payments/verified','POST',{charge_id:id,amount_cents:cents(amt),reference});msg('Verified payment recorded');await loadLedger()});
$('propertyForm').onsubmit=e=>{e.preventDefault();act(async()=>{const f=new FormData(e.target);await api('/manager/properties','POST',{name:f.get('name'),address:f.get('address'),rooms_count:Number(f.get('rooms_count')),monthly_rent_cents:cents(f.get('monthly_rent')),due_day:Number(f.get('due_day'))});e.target.reset();msg('Property created');await load()})};
$('loginForm').onsubmit=e=>{e.preventDefault();act(async()=>{const r=await api('/auth/login','POST',{email:$('email').value,password:$('password').value});if(!['manager','admin'].includes(r.user.role))throw Error('This account is not authorised as a manager.');token=r.token;sessionStorage.setItem('manager_token',token);await start()})};
$('logout').onclick=()=>{sessionStorage.removeItem('manager_token');token='';$('app').style.display='none';$('login').hidden=false;$('logout').style.display='none'};
async function start(){await api('/manager/overview');$('login').hidden=true;$('app').style.display='block';$('logout').style.display='inline-block';await load()}
if(token)act(async()=>{try{await start()}catch(e){sessionStorage.removeItem('manager_token');token='';msg('Session expired. Please sign in.',true)}});
</script></body></html>
